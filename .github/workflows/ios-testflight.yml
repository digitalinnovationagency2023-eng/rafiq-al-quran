name: iOS TestFlight release

# Builds the Rafiq Al-Quran Flutter iOS app (mobile/flutter/) on a macOS runner, signs it
# with Apple's cloud-managed automatic signing (App Store Connect API key with
# the Admin role; no certificate files in CI) and uploads it to TestFlight.
#
# Required repository secrets:
#   APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_PRIVATE_KEY (full contents of AuthKey_<KEY_ID>.p8)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (empty = 100 + run number)"
        required: false
        default: ""
      upload:
        description: "Upload to TestFlight after the build"
        type: boolean
        default: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile/flutter

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_SLUG: rafiq-al-quran
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing"; exit 1; }
          done

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Resolve version and build number
        id: ver
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ -n "$INPUT_BUILD" ]; then BUILD="$INPUT_BUILD"; else BUILD=$((100 + ${{ github.run_number }})); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "$APP_SLUG iOS $VERSION ($BUILD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Quran dataset is not in the repo (see docs/FLUTTER-PORT-MAP.md section 3):
      # import it from Quran.com, export the Android TSVs, then copy them into the
      # Flutter asset folders (translations split per language).
      - name: Generate the dataset assets
        working-directory: .
        run: |
          npm install --no-audit --no-fund
          npm run import:quran -w server
          node mobile/android/scripts/exportAssets.js
          node mobile/flutter/tool/sync_assets.mjs

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          if [ -d test ]; then flutter test; fi

      - name: Build Flutter iOS (release, unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ steps.ver.outputs.build }}

      - name: Archive with automatic cloud signing
        run: |
          set -o pipefail
          mkdir -p build/ios
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            FLUTTER_BUILD_NAME=${{ steps.ver.outputs.version }} \
            FLUTTER_BUILD_NUMBER=${{ steps.ver.outputs.build }} \
            | tee build/ios/archive.log | grep -E "error:|warning: .*(sign|provision)|\*\* ARCHIVE" || true
          test -d build/ios/archive/Runner.xcarchive || { tail -80 build/ios/archive.log; exit 1; }

      - name: Export IPA
        run: |
          cat > build/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist build/ios/ExportOptions.plist -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          NAMED="build/ios/ipa/${APP_SLUG}-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.build }}.ipa"
          mv "$IPA" "$NAMED"
          echo "IPA=$PWD/$NAMED" >> "$GITHUB_ENV"

      - name: Validate with App Store Connect
        run: xcrun altool --validate-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        run: xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-ios-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.build }}
          path: mobile/flutter/build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Remove the API key
        if: always()
        run: rm -f ~/private_keys/AuthKey_*.p8
