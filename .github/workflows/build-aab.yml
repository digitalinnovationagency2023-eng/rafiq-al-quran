name: Build release AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/build-aab.yml"

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 34 (runner already ships the SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)"
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Import the Quran dataset
        run: npm run import:quran -w server

      - name: Export app assets
        run: node mobile/android/scripts/exportAssets.js

      - name: Download bundletool (executable jar)
        run: |
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.0/bundletool-all-1.18.0.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" version

      - name: Build the AAB
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
          AAB_OUTPUT: ${{ github.workspace }}/dist/rafiq-al-quran.aab
        run: node mobile/android/scripts/buildAab.js

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-al-quran-aab
          path: dist/rafiq-al-quran.aab
          if-no-files-found: error
