name: rafiq_al_quran
description: "Rafiq Al-Quran: a Quran-only assistant. Read, search, listen and study the Quran offline with identified translations and sources."
publish_to: 'none'
version: 1.4.2+23

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.6.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # App Store screenshots on iOS simulators (integration_test/, test_driver/).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.7.2

flutter:
  uses-material-design: true

  # The dataset TSVs are generated by tool/sync_assets.mjs from the Android
  # export (see docs/FLUTTER-PORT-MAP.md section 3). Only quran-meta.tsv is
  # committed; the rest is produced on the CI runner before the build.
  assets:
    - assets/data/
    - assets/art/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
